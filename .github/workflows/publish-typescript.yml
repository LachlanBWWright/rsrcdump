name: Publish TypeScript Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.1)'
        required: true

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/rsrcdump-ts-v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'
        cache-dependency-path: rsrcdump-ts/package-lock.json
    
    - name: Install dependencies
      working-directory: ./rsrcdump-ts
      run: npm ci
    
    - name: Run tests
      working-directory: ./rsrcdump-ts
      run: npm test
    
    - name: Build
      working-directory: ./rsrcdump-ts
      run: npm run build
    
    - name: Publish to npm
      working-directory: ./rsrcdump-ts
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    
    - name: Create GitHub release notes
      uses: softprops/action-gh-release@v1
      with:
        body: |
          Published @lachlanwright/rsrcdump-ts v${{ github.ref_name }}
          
          Install with: `npm install @lachlanwright/rsrcdump-ts`
        files: |
          rsrcdump-ts/CHANGELOG.md

  publish-gpr:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/rsrcdump-ts-v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        registry-url: 'https://npm.pkg.github.com'
        cache: 'npm'
        cache-dependency-path: rsrcdump-ts/package-lock.json
    
    - name: Install dependencies
      working-directory: ./rsrcdump-ts
      run: npm ci
    
    - name: Build
      working-directory: ./rsrcdump-ts
      run: npm run build
    
    - name: Publish to GitHub Packages
      working-directory: ./rsrcdump-ts
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
